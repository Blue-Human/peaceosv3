[package]
name = "peaceos-verify-desktop"
version = "0.1.0"
description = "PeaceOS Verify desktop shell — wraps the Verify web portal for fully offline evidence verification."
authors = ["Blue Human"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "peaceos_verify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
# Phase B: the "update organizations" command. Pinned to the 2.x line
# deliberately (not the newer 3.x, which changed its request/response API
# significantly) — ureq's default features on 2.x (rustls + gzip) already
# give HTTPS with pure-Rust TLS, no system OpenSSL dependency, which matters
# for reproducible builds across the three OSes.
ureq = { version = "2.12.1", features = ["json"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
